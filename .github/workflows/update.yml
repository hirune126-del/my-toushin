name: 基準価額の更新と公開

on:
  schedule:
    # 平日の 21:30 と翌朝 7:30（日本時間）に実行。GitHub の混雑で数十分遅れることがあります。
    - cron: "30 12 * * 1-5"
    - cron: "30 22 * * 1-5"
  push:
    branches: [main]         # funds.txt やアプリを編集したらすぐ反映
  workflow_dispatch:         # Actions 画面から手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 基準価額データを取得
        run: node scripts/update.mjs
      - name: サイトを組み立て
        run: |
          mkdir _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest icons data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

      # 公開リポジトリでは 60 日間コミットがないと定期実行が止まるため、月に1度だけ小さな記録をコミットする
      - name: 定期実行の維持
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive
            git commit -m "keepalive"
            git push
          fi
