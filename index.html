<!doctype html>
<html lang="ja">
<head>

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">

<body>
  <header class="topbar">

    <h1 id="title">マイ投信ノート</h1>
    <span class="asof" id="asof"></span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar">

      <svg viewBox="0 0 24 24"><path d="M4 19V10m5.5 9V5M15 19v-6m5 6V8" /></svg><span>資産</span>

      <svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.1 5.5.8-4 3.9.9 5.5L12 16.7 7.1 19.3l.9-5.5-4-3.9 5.5-.8z" /></svg><span>ウォッチ</span>

    <a href="#search" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" /><path d="M16 16l4.5 4.5" /></svg><span>検索</span>
    </a>
    <a href="#settings" data-tab="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg><span>設定</span>
    </a>
  </nav>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
